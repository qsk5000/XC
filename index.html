<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التطور — Mizan Academy IQ</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
/* ══════════════════════════════════════
   TOKENS
══════════════════════════════════════ */
:root {
  --ink:    #09111E;
  --ink2:   #0D1A2D;
  --ink3:   #132035;
  --panel:  #111C2E;
  --card:   #162338;
  --border: rgba(197,160,89,.18);
  --gold:   #C5A059;
  --gold2:  #E2BF7A;
  --gold3:  #8B6B35;
  --goldBg: rgba(197,160,89,.08);
  --text:   #E8EDF5;
  --muted:  #7A8A9F;
  --dim:    #4A5568;
  --green:  #10B981;
  --red:    #EF4444;
  --amber:  #F59E0B;
  --blue:   #3B82F6;
  --purple: #8B5CF6;
  --r:      14px;
  --r-lg:   22px;
  --r-xl:   30px;
  --sh:     0 4px 24px rgba(0,0,0,.4);
  --sh-lg:  0 16px 50px rgba(0,0,0,.55);
  --tr:     .22s cubic-bezier(.4,0,.2,1);
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
  font-family:'Cairo',sans-serif;
  background:var(--ink);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:var(--ink2); }
::-webkit-scrollbar-thumb { background:var(--gold3); border-radius:4px; }

/* ══════════════════════════════════════
   LOADER
══════════════════════════════════════ */
#gLoader {
  display:none; position:fixed; inset:0;
  background:rgba(9,17,30,.88); backdrop-filter:blur(10px);
  z-index:9999; flex-direction:column;
  align-items:center; justify-content:center; gap:16px;
}
#gLoader.on { display:flex; }
.ring {
  width:52px; height:52px;
  border:4px solid rgba(197,160,89,.2);
  border-top-color:var(--gold); border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
#loaderTxt { font-weight:700; color:var(--muted); font-size:.9rem; }

/* ══════════════════════════════════════
   TOAST
══════════════════════════════════════ */
#toasts {
  position:fixed; top:20px; left:50%; transform:translateX(-50%);
  z-index:10000; display:flex; flex-direction:column; gap:10px;
  width:min(380px,92vw); pointer-events:none;
}
.toast {
  padding:13px 18px; border-radius:var(--r); font-weight:700; font-size:.88rem;
  display:flex; align-items:center; gap:10px; pointer-events:auto;
  animation:tIn .35s cubic-bezier(.34,1.56,.64,1);
  box-shadow:var(--sh-lg); backdrop-filter:blur(12px);
}
.toast.s { background:rgba(16,185,129,.18); border:1px solid rgba(16,185,129,.4); color:#6EE7B7; }
.toast.e { background:rgba(239,68,68,.15); border:1px solid rgba(239,68,68,.35); color:#FCA5A5; }
.toast.w { background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.4); color:#FCD34D; }
@keyframes tIn { from{opacity:0;transform:translateY(-14px) scale(.94)} to{opacity:1;transform:none} }

/* ══════════════════════════════════════
   CONFETTI
══════════════════════════════════════ */
#confettiLayer { position:fixed; inset:0; pointer-events:none; z-index:9998; overflow:hidden; }
.confetti-piece {
  position:absolute; top:-20px; width:9px; height:14px; opacity:.9;
  animation:confFall linear forwards;
  border-radius:2px;
}
@keyframes confFall {
  0%   { transform:translateY(0) rotate(0deg); opacity:1; }
  100% { transform:translateY(105vh) rotate(600deg); opacity:0; }
}

/* ══════════════════════════════════════
   HERO
══════════════════════════════════════ */
.hero {
  background:var(--ink2);
  border-bottom:1px solid var(--border);
  padding:56px 24px 100px;
  text-align:center;
  position:relative; overflow:hidden;
}
.hero-grid {
  position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(197,160,89,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(197,160,89,.03) 1px,transparent 1px);
  background-size:50px 50px;
}
.hero-glow {
  position:absolute; inset:0;
  background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(197,160,89,.07),transparent 65%);
}
.hero-inner { position:relative; z-index:2; }
.hero-badge {
  display:inline-flex; align-items:center; gap:8px;
  background:var(--goldBg); border:1px solid rgba(197,160,89,.3);
  padding:5px 16px; border-radius:30px;
  color:var(--gold2); font-size:.75rem; font-weight:700;
  letter-spacing:2px; text-transform:uppercase; margin-bottom:20px;
}
.hero-badge-dot { width:6px; height:6px; border-radius:50%; background:var(--gold); animation:bdot 2s infinite; }
@keyframes bdot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
.hero h1 { font-size:clamp(1.6rem,4vw,2.4rem); font-weight:900; color:var(--text); margin-bottom:8px; }
.hero h1 span {
  color:var(--gold);
  background:linear-gradient(90deg,var(--gold3),var(--gold2),var(--gold3));
  background-size:200%;
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  animation:shine 3s linear infinite;
}
@keyframes shine { 0%{background-position:200%} 100%{background-position:-200%} }
.hero p { color:var(--muted); font-size:.92rem; font-weight:600; }

/* ══════════════════════════════════════
   SEARCH CARD
══════════════════════════════════════ */
.container { max-width:860px; margin:0 auto; padding:0 16px 80px; position:relative; top:-52px; }

.search-card {
  background:var(--panel); border:1px solid var(--border);
  border-radius:var(--r-xl); padding:32px 28px;
  box-shadow:var(--sh-lg); margin-bottom:24px;
  text-align:center;
}
.search-card h3 { font-weight:900; color:var(--text); margin-bottom:6px; font-size:1.1rem; }
.search-card p  { color:var(--muted); font-size:.82rem; margin-bottom:22px; }
.search-row { display:flex; gap:10px; max-width:400px; margin:0 auto; }
.search-field {
  flex:1; padding:14px 18px;
  background:var(--ink2); border:1.5px solid rgba(197,160,89,.2);
  border-radius:var(--r); color:var(--text); font-family:'Cairo',sans-serif;
  font-weight:700; font-size:1rem; text-align:center; letter-spacing:3px;
  outline:none; transition:border-color var(--tr), box-shadow var(--tr);
}
.search-field::placeholder { letter-spacing:0; color:var(--dim); font-weight:500; }
.search-field:focus { border-color:var(--gold); box-shadow:0 0 0 4px rgba(197,160,89,.12); }
.btn-search {
  padding:14px 22px; border-radius:var(--r);
  background:linear-gradient(135deg,var(--gold3),var(--gold));
  color:var(--ink); font-family:'Cairo',sans-serif;
  font-weight:900; font-size:.9rem; border:none; cursor:pointer;
  transition:all var(--tr); white-space:nowrap;
  box-shadow:0 4px 16px rgba(197,160,89,.3);
}
.btn-search:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(197,160,89,.4); }
.btn-search:active { transform:none; }
.err-msg {
  display:flex; align-items:center; gap:8px; justify-content:center;
  color:#FCA5A5; font-size:.85rem; font-weight:700; margin-top:12px; min-height:20px;
}
.quick-chip-row { display:flex; justify-content:center; margin-top:16px; }
.quick-chip {
  display:inline-flex; align-items:center; gap:7px;
  background:var(--ink2); border:1px dashed rgba(197,160,89,.3);
  color:var(--muted); font-family:'Cairo',sans-serif; font-weight:700;
  font-size:.78rem; padding:8px 16px; border-radius:20px; cursor:pointer;
  transition:all var(--tr);
}
.quick-chip:hover { border-color:var(--gold); color:var(--gold2); background:var(--goldBg); }

/* ══════════════════════════════════════
   IDENTITY STRIP
══════════════════════════════════════ */
.id-strip {
  background:var(--panel); border:1px solid var(--border);
  border-radius:var(--r-xl); padding:22px 26px;
  display:flex; align-items:center; gap:18px;
  margin-bottom:20px; box-shadow:var(--sh); flex-wrap:wrap;
}
.id-avatar-wrap { position:relative; flex-shrink:0; }
.id-avatar {
  width:62px; height:62px; border-radius:50%;
  background:linear-gradient(135deg,var(--gold3),var(--gold));
  display:flex; align-items:center; justify-content:center;
  font-size:1.5rem; font-weight:900; color:var(--ink);
  border:3px solid rgba(197,160,89,.3);
}
.grade-badge {
  position:absolute; bottom:-4px; left:-4px;
  width:28px; height:28px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:.68rem; font-weight:900; color:#fff;
  border:2px solid var(--panel);
  box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.id-body { flex:1; min-width:180px; }
.id-name  { font-weight:900; color:var(--text); font-size:1.05rem; }
.id-code  { color:var(--muted); font-size:.78rem; font-weight:600; margin-top:3px; }
.id-grade-label { font-size:.76rem; font-weight:800; margin-top:4px; }
.badges-row { display:flex; flex-wrap:wrap; gap:7px; margin-top:8px; }
.badge {
  display:inline-flex; align-items:center; gap:5px;
  padding:4px 12px; border-radius:20px; font-size:.72rem; font-weight:800;
  background:var(--goldBg); border:1px solid rgba(197,160,89,.3); color:var(--gold2);
}
.badge.green { background:rgba(16,185,129,.1); border-color:rgba(16,185,129,.3); color:#6EE7B7; }
.badge.blue  { background:rgba(59,130,246,.1); border-color:rgba(59,130,246,.3); color:#93C5FD; }
.badge.purple{ background:rgba(139,92,246,.1); border-color:rgba(139,92,246,.3); color:#C4B5FD; }

/* ══════════════════════════════════════
   QUOTE BANNER
══════════════════════════════════════ */
.quote-banner {
  background:linear-gradient(90deg,var(--goldBg),transparent);
  border:1px solid var(--border); border-right:3px solid var(--gold);
  border-radius:var(--r-lg); padding:14px 18px; margin-bottom:20px;
  display:flex; align-items:center; gap:12px;
  font-size:.85rem; font-weight:700; color:var(--gold2); line-height:1.6;
}
.quote-banner i { font-size:1.1rem; flex-shrink:0; }

/* ══════════════════════════════════════
   KPI STRIP
══════════════════════════════════════ */
.kpi-row { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px; }
@media(max-width:480px) { .kpi-row { grid-template-columns:1fr 1fr; } }
.kpi-box {
  background:var(--panel); border:1px solid var(--border);
  border-radius:var(--r-lg); padding:18px 14px; text-align:center;
  transition:all var(--tr);
}
.kpi-box:hover { border-color:rgba(197,160,89,.35); transform:translateY(-3px); }
.kpi-icon {
  width:38px; height:38px; border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-size:.9rem; margin:0 auto 10px;
}
.kpi-val { font-size:1.6rem; font-weight:900; color:var(--text); line-height:1; }
.kpi-lbl { font-size:.7rem; color:var(--muted); font-weight:700; margin-top:4px; }

/* ══════════════════════════════════════
   STRENGTH / WEAKNESS HIGHLIGHTS
══════════════════════════════════════ */
.highlight-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px; }
@media(max-width:520px) { .highlight-row { grid-template-columns:1fr; } }
.highlight-card {
  border-radius:var(--r-xl); padding:20px; box-shadow:var(--sh);
  position:relative; overflow:hidden; border:1px solid var(--border);
}
.highlight-card.strong { background:linear-gradient(135deg,rgba(16,185,129,.12),var(--panel)); }
.highlight-card.weak   { background:linear-gradient(135deg,rgba(239,68,68,.1),var(--panel)); }
.hl-top { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.hl-icon { width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:.9rem; }
.hl-label { font-size:.72rem; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
.hl-subj { font-size:1.05rem; font-weight:900; color:var(--text); margin-bottom:4px; }
.hl-val { font-size:1.5rem; font-weight:900; }

/* ══════════════════════════════════════
   CHART CARDS
══════════════════════════════════════ */
.chart-card {
  background:var(--panel); border:1px solid var(--border);
  border-radius:var(--r-xl); padding:24px;
  margin-bottom:20px; box-shadow:var(--sh);
}
.chart-head {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:18px; flex-wrap:wrap; gap:10px;
}
.chart-title { font-weight:900; color:var(--text); font-size:.95rem; display:flex; align-items:center; gap:8px; }
.chart-title i { color:var(--gold); font-size:.88rem; }
.chart-sub { font-size:.75rem; color:var(--muted); font-weight:600; }
.chart-wrap { position:relative; height:220px; }

/* ══════════════════════════════════════
   SUBJECT CARDS
══════════════════════════════════════ */
.subjects-label {
  font-size:.8rem; font-weight:700; color:var(--muted);
  text-transform:uppercase; letter-spacing:1.5px;
  margin-bottom:14px; display:flex; align-items:center; gap:8px;
}
.subjects-label::after { content:''; flex:1; height:1px; background:var(--border); }

.subj-card {
  background:var(--panel); border:1px solid var(--border);
  border-radius:var(--r-xl); padding:22px 24px;
  margin-bottom:14px; box-shadow:var(--sh);
  transition:all var(--tr); position:relative; overflow:hidden;
}
.subj-card::before {
  content:''; position:absolute; top:0; right:0; width:3px; height:100%;
  background:var(--gold); border-radius:0 var(--r-xl) var(--r-xl) 0;
  transition:width var(--tr);
}
.subj-card:hover { border-color:rgba(197,160,89,.3); transform:translateX(-4px); }
.subj-card:hover::before { width:5px; }

.rank-chip {
  position:absolute; top:14px; left:14px;
  width:24px; height:24px; border-radius:50%;
  background:var(--ink2); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:.68rem; font-weight:900; color:var(--muted);
}

.subj-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:10px; padding-right:26px; }
.subj-name { font-weight:900; color:var(--text); font-size:1rem; display:flex; align-items:center; gap:10px; }
.subj-emoji { font-size:1.2rem; }
.chip-group { display:flex; flex-wrap:wrap; gap:6px; }
.trend-chip, .predict-chip {
  display:inline-flex; align-items:center; gap:5px;
  padding:5px 12px; border-radius:20px; font-size:.75rem; font-weight:800;
}
.trend-up   { background:rgba(16,185,129,.12); color:#34D399; border:1px solid rgba(16,185,129,.25); }
.trend-down { background:rgba(239,68,68,.1); color:#FCA5A5; border:1px solid rgba(239,68,68,.2); }
.trend-flat { background:rgba(245,158,11,.1); color:#FCD34D; border:1px solid rgba(245,158,11,.25); }
.predict-chip { background:rgba(139,92,246,.1); color:#C4B5FD; border:1px solid rgba(139,92,246,.25); }

.subj-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
@media(max-width:480px) { .subj-stats { grid-template-columns:repeat(2,1fr); } }
.ss-box { background:var(--card); border-radius:var(--r); padding:10px 8px; text-align:center; border:1px solid var(--border); }
.ss-val { font-size:1.15rem; font-weight:900; color:var(--text); }
.ss-lbl { font-size:.68rem; color:var(--muted); font-weight:700; margin-top:2px; }

.prog-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.prog-track { flex:1; height:8px; background:var(--card); border-radius:4px; overflow:hidden; }
.prog-fill { height:100%; border-radius:4px; transition:width 1.4s cubic-bezier(.4,0,.2,1); width:0%; }
.prog-pct { font-size:.8rem; font-weight:900; color:var(--muted); min-width:36px; text-align:left; }

.timeline { display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; }
.timeline::-webkit-scrollbar { height:4px; }
.tl-dot {
  min-width:36px; height:36px; border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-weight:900; font-size:.75rem; flex-shrink:0;
  position:relative; transition:transform var(--tr);
}
.tl-dot:hover { transform:scale(1.15); }
.tl-dot.ex { background:rgba(16,185,129,.2); color:#34D399; border:1px solid rgba(16,185,129,.3); }
.tl-dot.av { background:rgba(245,158,11,.15); color:#FCD34D; border:1px solid rgba(245,158,11,.3); }
.tl-dot.lo { background:rgba(239,68,68,.12); color:#FCA5A5; border:1px solid rgba(239,68,68,.25); }
.tl-dot.last { box-shadow:0 0 0 3px rgba(197,160,89,.4); }

.smart-note {
  background:var(--goldBg); border:1px solid rgba(197,160,89,.2);
  border-radius:var(--r); padding:12px 14px;
  font-size:.82rem; color:var(--muted); line-height:1.6;
  display:flex; gap:10px; align-items:flex-start;
}
.smart-note i { color:var(--gold); flex-shrink:0; margin-top:2px; }

.mini-chart-wrap { height:80px; margin:10px 0; }

/* ══════════════════════════════════════
   ACTION BUTTONS
══════════════════════════════════════ */
.action-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
@media(max-width:480px) { .action-row { grid-template-columns:1fr; } }
.action-btn {
  padding:16px; background:transparent; border:1.5px dashed rgba(197,160,89,.3);
  border-radius:var(--r-lg); color:var(--muted);
  font-family:'Cairo',sans-serif; font-weight:700; font-size:.9rem;
  cursor:pointer; transition:all var(--tr);
  display:flex; align-items:center; justify-content:center; gap:10px;
}
.action-btn:hover { border-color:var(--gold); color:var(--gold); background:var(--goldBg); }

/* ══════════════════════════════════════
   HELPERS
══════════════════════════════════════ */
.hidden { display:none; }
.reveal { opacity:0; transform:translateY(14px); transition:opacity .5s ease,transform .5s ease; }
.reveal.vis { opacity:1; transform:none; }

@media print {
  body { background:#fff !important; color:#000 !important; }
  .no-print, .hero-badge, #toasts, #gLoader, #confettiLayer { display:none !important; }
  .hero { background:#fff; border:none; padding:20px; }
  .hero h1, .hero p { color:#000 !important; -webkit-text-fill-color:#000 !important; }
  .id-strip, .kpi-box, .chart-card, .subj-card, .highlight-card {
    background:#fff !important; border:1px solid #ccc !important; box-shadow:none !important;
    break-inside:avoid;
  }
  .id-name, .kpi-val, .subj-name, .ss-val, .hl-subj { color:#000 !important; }
}

@media(max-width:500px) {
  .search-row { flex-direction:column; }
  .id-strip { flex-direction:column; text-align:center; }
  .id-strip .badges-row { justify-content:center; }
}
</style>
</head>
<body>

<div id="gLoader"><div class="ring"></div><div id="loaderTxt">جاري التحليل...</div></div>
<div id="toasts"></div>
<div id="confettiLayer"></div>

<div class="hero">
  <div class="hero-grid"></div>
  <div class="hero-glow"></div>
  <div class="hero-inner">
    <div class="hero-badge"><div class="hero-badge-dot"></div> MIZAN ACADEMY IQ</div>
    <h1>لوحة <span>التطور الدراسي</span></h1>
    <p>تحليل شامل ودقيق لمسيرتك الأكاديمية</p>
  </div>
</div>

<div class="container" id="pageWrap">

  <div class="search-card reveal no-print" id="searchCard">
    <h3>استعلام عن المسيرة الدراسية</h3>
    <p>أدخل كود الطالب للحصول على تقرير تفصيلي</p>
    <div class="search-row">
      <input class="search-field" id="codeIn" type="text" placeholder="كود الطالب"
        autocomplete="off" oninput="this.value=this.value.toUpperCase()"
        onkeydown="if(event.key==='Enter')doFetch()">
      <button class="btn-search" onclick="doFetch()">
        <i class="fas fa-chart-line"></i> تحليل
      </button>
    </div>
    <div class="err-msg" id="errMsg"></div>
    <div class="quick-chip-row" id="quickChipRow"></div>
  </div>

  <div id="results"></div>

</div>

<script>

function loader(msg='') { $('loaderTxt').textContent=msg; $('gLoader').classList.add('on'); }
function unloader()     { $('gLoader').classList.remove('on'); }

function toast(msg, type='s', dur=3400) {
  const icons={s:'fa-check-circle',e:'fa-times-circle',w:'fa-exclamation-triangle'};
  const el=document.createElement('div');
  el.className=`toast ${type}`;
  el.innerHTML=`<i class="fas ${icons[type]}"></i><span>${msg}</span>`;
  $('toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.3s'; }, dur-350);
  setTimeout(()=>el.remove(), dur);
}

function esc(s){ return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

const IO = new IntersectionObserver(entries=>{
  entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('vis'); });
},{threshold:.1});
function observe(el){ IO.observe(el); }

/* ── Count-up animation ── */
function countUp(el, target, suffix='', dur=900){
  const start=performance.now();
  const from=0;
  function step(now){
    const p=clamp((now-start)/dur,0,1);
    const eased=1-Math.pow(1-p,3);
    const val=(from+(target-from)*eased);
    el.textContent = (Number.isInteger(target) ? Math.round(val) : val.toFixed(1)) + suffix;
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ── Confetti (lightweight, no external lib) ── */
function fireConfetti(){
  const colors=['#C5A059','#E2BF7A','#10B981','#3B82F6','#8B5CF6'];
  const layer=$('confettiLayer');
  for(let i=0;i<60;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    p.style.left=Math.random()*100+'vw';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];

  }
}

/* ── Analytics ── */
function parsePct(v) {
  const s=String(v);
  if(s.includes('/')) { const [a,b]=s.split('/'); return Math.round((parseFloat(a)/parseFloat(b))*100); }
  return parseFloat(s)||0;
}

function scoreClass(s) { return s>=80?'ex':s>=50?'av':'lo'; }
function scoreColor(s) { return s>=80?'var(--green)':s>=50?'var(--amber)':'var(--red)'; }

function gradeInfo(avg){
  if(avg>=95) return {letter:'A+',label:'متميز استثنائي',color:'#10B981'};
  if(avg>=90) return {letter:'A', label:'ممتاز',           color:'#34D399'};
  if(avg>=80) return {letter:'B+',label:'جيد جداً مرتفع',   color:'#60A5FA'};
  if(avg>=70) return {letter:'B', label:'جيد جداً',         color:'#3B82F6'};
  if(avg>=60) return {letter:'C+',label:'جيد',             color:'#F59E0B'};
  if(avg>=50) return {letter:'C', label:'مقبول',           color:'#FBBF24'};
  if(avg>=40) return {letter:'D', label:'ضعيف',            color:'#F87171'};
  return               {letter:'F', label:'ضعيف جداً',       color:'#EF4444'};
}

function calcStats(scores) {
  const n=scores.length;
  if(!n) return {avg:0,max:0,min:0,last:0,prev:0,trend:'flat',predicted:0};
  const avg=scores.reduce((a,b)=>a+b,0)/n;
  const last=scores[n-1], prev=scores[n-2]??last;
  const diff=last-prev;
  const predicted = n>1 ? Math.round(clamp(last+diff*0.6,0,100)) : last;
  return {
    avg:parseFloat(avg.toFixed(1)),
    max:Math.max(...scores),
    min:Math.min(...scores),
    last, prev,
    trend: diff>1?'up':diff<-1?'down':'flat',
    predicted
  };
}

function getRecommendation(subj, st) {
  const {last,prev,avg,max} = st;
  if(last>=95) return `أداء استثنائي في ${subj}! أنت تنافس على القمة.`;
  if(last<40)  return `مستوى ${subj} يحتاج تدخلاً فورياً. راجع المادة من البداية مع الأستاذ.`;
  if(last<55)  return `درجة ${subj} أقل من المتوسط. ركّز على الواجبات ولا تفوت أي تمرين.`;
  if(last>prev+8)  return `قفزة رائعة في ${subj}! استمر بنفس الأسلوب.`;
  if(last<prev-8)  return `تراجع ملحوظ في ${subj}. لا تيأس — راجع آخر اختبار وحدّد نقطة الضعف.`;
  if(avg>=80)  return `معدل ${subj} ممتاز. اهدف لتجاوز ${Math.min(max+3,100)} في الاختبار القادم.`;
  return `مستوى ${subj} جيد ويمكن تطويره. حاول حل تمارين إضافية لرفع المعدل.`;
}

function generateBadges(data, avg) {
  let b=[];
  if(avg>=90) b.push({icon:'fa-crown',label:'طالب ذهبي',cl:''});
  if(avg>=80 && avg<90) b.push({icon:'fa-medal',label:'مستوى ممتاز',cl:'blue'});
  if((data.absences||0)===0) b.push({icon:'fa-shield-alt',label:'صفر غيابات',cl:'green'});
  const subjects=Object.keys(data.exams||{});
  if(subjects.length>0){
    const allPass=subjects.every(s=>{ const sc=data.exams[s].map(v=>parsePct(v)); return Math.max(...sc)>=90; });
    if(allPass) b.push({icon:'fa-bolt',label:'قناص الدرجات',cl:'purple'});
  }
  if((data.absences||0)<=2 && avg>=75) b.push({icon:'fa-fire',label:'متفوق ملتزم',cl:''});
  return b.map(x=>`<div class="badge ${x.cl}"><i class="fas ${x.icon}"></i>${x.label}</div>`).join('');
}

/* ── Main fetch ── */
async function doFetch() {
  const code=$('codeIn').value.trim().toUpperCase();
  if(!code){ toast('أدخل كود الطالب','w'); return; }
  $('errMsg').innerHTML='';
  loader('جاري تحليل بياناتك...');

  activeCharts.forEach(c=>c.destroy&&c.destroy());
  activeCharts=[];

  try {
    const doc = await db.collection('StudentResults').doc(code).get();
    if(!doc.exists){
      $('errMsg').innerHTML='<i class="fas fa-exclamation-triangle"></i> الكود غير موجود في النظام';
      $('results').innerHTML='';
      unloader(); return;
    }
    const data = doc.data();
    localStorage.setItem('mizan_last_code', code);
    buildUI(data, code);
    toast(`تم تحميل تقرير ${data.name}، تحقق من نتائجك`,'s');
  } catch(e) {
    toast('خطأ في الاتصال بالخادم','e');
    console.error(e);
  }
  unloader();
}

      },400);
    }
  });

  // ── Action buttons ──
  const actionEl=document.createElement('div');
  actionEl.className='action-row reveal no-print';
  actionEl.innerHTML=`
    <button class="action-btn" onclick="doShare()"><i class="fas fa-camera"></i> حفظ كصورة</button>
    <button class="action-btn" onclick="window.print()"><i class="fas fa-print"></i> طباعة التقرير</button>`;
  res.appendChild(actionEl);
  observe(actionEl);

  // Celebrate top performers
  if(overall>=90){ setTimeout(fireConfetti, 500); }
}

/* ── Share ── */
async function doShare(){
  loader('جاري إنشاء الصورة...');
  try{
    const canvas=await html2canvas($('pageWrap'),{
      backgroundColor:'#09111E',scale:2,useCORS:true,
      ignoreElements:el=>el.classList && el.classList.contains('no-print')
    });
    const link=document.createElement('a');
    link.download=`تقرير_ميزان_${new Date().toLocaleDateString('ar')}.png`;
    link.href=canvas.toDataURL('image/png');
    link.click();
    toast('تم حفظ التقرير بنجاح','s');
  }catch(e){ toast('حدث خطأ أثناء إنشاء الصورة','e'); }
  unloader();
}

/* ── Init ── */
document.querySelectorAll('.reveal').forEach(el=>IO.observe(el));
setupQuickRecall();
</script>
